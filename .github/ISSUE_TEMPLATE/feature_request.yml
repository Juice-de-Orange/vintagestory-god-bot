name: Feature request
description: Suggest an action, a personality trait or another improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What would you like the deity to do that it cannot today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: For a new action, say how ActionPolicy should validate it.
    validations:
      required: true
